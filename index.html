<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RoboArena — Допуск до заїздів</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="field-surface" aria-hidden="true">
      <svg class="track-svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
        <defs>
          <pattern id="grid-pattern" width="60" height="60" patternUnits="userSpaceOnUse">
            <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#d2d7dc" stroke-width="1" />
            <circle cx="60" cy="0" r="1.5" fill="#9da7b3" />
          </pattern>

          <path
            id="race-track"
            d="M 370 410
               C 450 410, 470 450, 520 450
               L 720 450
               L 920 450
               C 1060 450, 1160 300, 1260 320
               C 1360 340, 1370 580, 1260 680
               C 1140 790, 840 760, 680 730
               C 480 690, 240 750, 180 610
               C 130 500, 220 410, 370 410
               Z"
          />
        </defs>

        <rect width="100%" height="100%" fill="url(#grid-pattern)" />

        <g class="start-box" transform="translate(130, 180)">
          <rect width="250" height="210" fill="none" stroke="#181c20" stroke-width="2" stroke-dasharray="8 6" />
          <text x="18" y="32" class="field-label">СТАТУС ГОНКИ // РОЗКЛАД</text>

          <text x="18" y="58" class="field-info-title">СТАН ТРАСИ:</text>
          <text x="18" y="78" class="field-info-event">ОЧІКУВАННЯ СТАРТУ</text>

          <text x="18" y="112" class="field-info-title">РЕЖИМ ДОПУСКУ:</text>
          <text x="18" y="132" class="field-info-event">РЕЄСТРАЦІЯ ВІДКРИТА</text>

          <text x="18" y="166" class="field-info-title">ЧАС ДО КВАЛІФІКАЦІЇ:</text>
          <text x="18" y="186" class="field-info-sub">СКОРО</text>
        </g>

        <use href="#race-track" fill="none" stroke="#181c20" stroke-width="18"
             stroke-linejoin="round" stroke-linecap="round" />
        <use href="#race-track" fill="none" stroke="#edf0f3" stroke-width="2"
             stroke-dasharray="6 8" />

        <line x1="370" y1="386" x2="370" y2="434" stroke="#c23b00" stroke-width="6" />

        <g id="track-bot" class="bot-marker">
          <g class="bot-body">
            <rect class="bot-shell" x="-13" y="-8" width="26" height="16" rx="3" />
            <rect class="bot-light" x="10" y="-3.5" width="5" height="7" rx="1" />
          </g>
          <animateMotion id="bot-motion" dur="24s" repeatCount="indefinite" rotate="auto">
            <mpath href="#race-track" />
          </animateMotion>
        </g>
      </svg>
    </div>

    <main class="dock-container">
      <div id="auth-card-box" class="dock-card">
        <header class="dock-header">
          <div class="header-meta">
            <span class="hub-tag">CONTROL POINT // GATE A</span>
            <span class="track-status">TRACK: ACTIVE</span>
          </div>
          <h1 class="dock-title">Robo<span>Arena</span></h1>
          <p class="dock-desc">Авторизація пілота та реєстрація на регламентний заїзд</p>
        </header>

        <div class="dock-tabs" role="tablist" aria-label="Режим допуску">
          <button type="button" id="tab-login-btn" class="tab-btn active"
                  role="tab" aria-selected="true" aria-controls="form-login">Вхід</button>
          <button type="button" id="tab-reg-btn" class="tab-btn"
                  role="tab" aria-selected="false" aria-controls="form-register">Реєстрація</button>
        </div>

        <div id="auth-alert" class="alert-box hidden" role="alert"></div>

        <form id="form-login" class="dock-form" role="tabpanel" aria-labelledby="tab-login-btn" novalidate>
          <div class="form-group">
            <label for="login-email">Позивний або Email</label>
            <input
              type="text"
              id="login-email"
              placeholder="pilot@example.com"
              autocomplete="username"
              autocapitalize="off"
              spellcheck="false"
              required
            />
          </div>

          <div class="form-group">
            <label for="login-password">Ключ доступу (Пароль)</label>
            <input
              type="password"
              id="login-password"
              placeholder="Ваш пароль"
              autocomplete="current-password"
              required
            />
          </div>

          <button type="submit" class="btn-action">Увійти в кабінет</button>
        </form>

        <form id="form-register" class="dock-form hidden" role="tabpanel" aria-labelledby="tab-reg-btn" novalidate>
          <div class="form-group">
            <label for="reg-username">Позивний пілота</label>
            <input
              type="text"
              id="reg-username"
              placeholder="Pilot_01"
              autocomplete="nickname"
              autocapitalize="off"
              spellcheck="false"
              required
            />
          </div>

          <div class="form-group">
            <label for="reg-email">Контактний Email</label>
            <input
              type="email"
              id="reg-email"
              placeholder="pilot@team.edu.ua"
              autocomplete="email"
              autocapitalize="off"
              spellcheck="false"
              required
            />
          </div>

          <div class="form-group">
            <label for="reg-password">Створити пароль</label>
            <input
              type="password"
              id="reg-password"
              placeholder="Мінімум 8 символів"
              autocomplete="new-password"
              required
            />
          </div>

          <button type="submit" class="btn-action">Зареєструвати пілота</button>
        </form>

        <footer class="dock-footer">
          <span>GATEWAY ONLINE</span>
          <span class="version-tag">v0.1.0-alpha</span>
        </footer>
      </div>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
